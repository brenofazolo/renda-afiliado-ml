<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Renda Afiliado ML</title><link rel="icon" type="image/png" href="{{ url_for('static', filename='lances-tech-logo.png') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-card"><img class="login-logo" src="{{ url_for('static', filename='lances-tech-logo.png') }}" alt="Lances Tech"><div class="login-product"><b>Renda Afiliado ML</b><span>Interface piloto</span></div>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><small>A sessão é encerrada por inatividade, pelo limite de tempo ou pelo botão Sair.</small></main></body></html>
