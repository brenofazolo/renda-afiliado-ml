<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Renda Afiliado ML</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
